[package]
name = "slopos-package"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "A package built from the directory it is laid out in and checked as an install checks it, on the host"

[lints]
workspace = true

[[bin]]
name = "package"
path = "src/main.rs"

[dependencies]
slopos-package-core = { workspace = true, features = ["std"] }

[dev-dependencies]
slopos-package-core = { workspace = true, features = ["std", "test-elf"] }
