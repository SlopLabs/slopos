## The x86_64-unknown-slopos target for OpenSSL's `Configure --config`.
##
## An ELF, pthreads, dlfcn Unix on x86-64 whose shared objects are linked by
## GNU-compatible `ld.lld`. Not `linux-x86_64`: that target turns on the
## AF_ALG engine, which speaks a Linux kernel socket family SlopOS does not
## have.

my %targets = (
    "slopos-x86_64" => {
        inherit_from     => [ "BASE_unix" ],
        CFLAGS           => picker(default => "-Wall",
                                   debug   => "-O0 -g",
                                   release => "-O3"),
        cflags           => threads("-pthread"),
        lib_cppflags     => "-DL_ENDIAN",
        ex_libs          => add(threads("-pthread")),
        bn_ops           => "SIXTY_FOUR_BIT_LONG RC4_CHAR",
        asm_arch         => "x86_64",
        perlasm_scheme   => "elf",
        thread_scheme    => "pthreads",
        dso_scheme       => "dlfcn",
        shared_target    => "linux-shared",
        shared_cflag     => "-fPIC",
        # libssl finds libcrypto beside itself: the guest has no
        # LD_LIBRARY_PATH and keeps these in the toolchain's lib/.
        shared_ldflag    => "-Wl,-z,defs -Wl,-rpath,'\$\$ORIGIN'",
    },
);
