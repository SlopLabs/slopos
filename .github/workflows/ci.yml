name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  # The `just ci-*` recipes put it on their build steps only: a gate that asks
  # what a compiler does gets a fresh answer, never a cached one.
  CI_RUSTC_WRAPPER: sccache

# Every job is the shared setup and then one `just ci-*` recipe, so a red job
# reproduces locally with the command it ran, and `just ci` runs them all.
jobs:
  gates:
    name: Host tests, clippy and gates
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      # A cached wild would answer a gate's question with a stale linker, so
      # ~/.cargo/bin is not cached; `ci-candidates` installs its own under
      # builddir/candidates, cached below.
      - uses: ./.github/actions/setup
        with:
          job: gates
          go: "true"
          rust-cache-bin: "false"

      - name: Gates lane
        run: just ci-gates

      - name: Cache the pinned wild binary
        if: ${{ !cancelled() }}
        uses: actions/cache@v6
        with:
          path: builddir/candidates
          key: wild-linker-0.10.0-${{ runner.os }}

      # `-preview` components go missing from individual nightlies, so a
      # missing cranelift is a skip; a wild that fails to build is a failure.
      - name: Candidate backends and linkers
        if: ${{ !cancelled() }}
        run: just ci-candidates

      - if: always()
        uses: ./.github/actions/sccache-save
        with:
          job: gates

  # The suite and the boot checks share one build of the tests system, so they
  # share one machine: each boot check is under a minute, setting up and
  # building again on another machine is several.
  suite:
    name: Test suite and boot checks
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          job: suite
          go: "true"
          llvm: "true"
          kvm: "true"
          pinned-sources: "true"
          apt: xorriso e2fsprogs cmake ninja-build make pkg-config openssh-client

      - name: Suite lane
        run: just ci-suite

      - if: always()
        uses: ./.github/actions/sccache-save
        with:
          job: suite

      - name: Upload the suite's capture on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-test-log
          path: builddir/ci-test.log
          if-no-files-found: ignore

  toolchain:
    name: Toolchain port
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # A cold compiler cache puts ~42 CPU-minutes of clang back in this job,
    # and the recipes' own translation units beside it.
    timeout-minutes: 60
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      SLOPOS_CROSS_LAUNCHER: ccache
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          job: toolchain
          llvm: "true"
          pinned-sources: "true"
          apt: cmake meson ninja-build ccache pkg-config

      - name: Point ccache at its cache
        run: |
          {
            echo "CCACHE_DIR=$HOME/.cache/ccache"
            echo "CCACHE_COMPILERCHECK=string:$(clang-18 --version | head -n 1)"
          } >> "$GITHUB_ENV"

      # Tarballs only: the unpacked trees and the probes' build directories are
      # what the gates grade, and a cached one would be a cached answer.
      - name: Cache the pinned rustc source tarball
        uses: actions/cache@v6
        with:
          path: third_party/rustc-src-*.tar.xz
          key: rustc-src-${{ hashFiles('rust-toolchain.toml') }}

      - name: Restore the compiler cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ccache
          key: ccache-toolchain-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-toolchain-${{ runner.os }}-

      - run: ccache --zero-stats

      - name: Toolchain lane
        run: just ci-toolchain

      - name: Count compiler cache misses
        id: ccache
        if: always()
        run: echo "misses=$(ccache --print-stats | awk '$1 == "cache_miss" { print $2 }')" >> "$GITHUB_OUTPUT"

      - name: Save the compiler cache
        if: always() && steps.ccache.outputs.misses != '0'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ccache
          key: ccache-toolchain-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - if: always()
        uses: ./.github/actions/sccache-save
        with:
          job: toolchain

  ostd-verify:
    name: OSTD verification (KernMiri + Verus)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      # KernMiri builds one host-target crate and interprets it, so the owned
      # `slopos` sysroot is pure cost here.
      - uses: ./.github/actions/setup
        with:
          job: ostd-verify
          sysroot: "false"
          apt: unzip

      - name: Cache Miri sysroot
        uses: actions/cache@v6
        with:
          path: ~/.cache/miri
          key: miri-sysroot-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}

      - name: Cache pinned Verus toolchain
        uses: actions/cache@v6
        with:
          path: third_party/verus
          key: verus-${{ runner.os }}-${{ hashFiles('verification/verus.toml') }}

      - name: KernMiri
        run: just check-miri

      # Any change to slopos-ostd/ must pass: Verus is resolved and pinned by
      # scripts/ensure_verus.sh, then every proof under verification/proofs/.
      - name: Verus proofs
        if: ${{ !cancelled() }}
        run: just verify
