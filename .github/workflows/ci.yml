name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  # Only what reads the tests build or its boot capture: this job is the wall
  # clock, and anything else runs beside it.
  ci:
    name: Build, Format & Test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Setup Go toolchain
        uses: actions/setup-go@v7
        with:
          go-version-file: tools/run_tests/go.mod
          cache-dependency-path: tools/run_tests/go.sum

      - name: Setup Rust + Go toolchains
        run: just setup

      - name: Check formatting
        run: just fmt

      # clang/cmake/ninja/lld are the C++ runtime's cross-build, which the
      # tests image needs: `libc++.so` and the two fixtures that prove a C++
      # exception crosses a `dlopen` boundary. `toolchain/cxx/PIN` states a
      # *floor* (`clang_major_min`) so a rolling host can build it at all, and
      # the env vars below pin CI to the sources' own major regardless of what
      # the runner image happens to default to — `scripts/cxx_host_tools.sh`
      # treats them as an override that never falls back.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 \
            xorriso \
            e2fsprogs \
            clang-18 \
            lld-18 \
            llvm-18 \
            cmake \
            ninja-build
          # Named, not aliased: `update-alternatives --install` with a missing
          # target warns and exits 0, so a wrong package name would surface
          # much later as a cross-build failure with nothing pointing here.
          for tool in clang-18 clang++-18 ld.lld-18 llvm-ar-18; do
            command -v "$tool" >/dev/null || { echo "::error::$tool not installed"; exit 1; }
          done
          {
            echo "CLANG=clang-18"
            echo "CLANGXX=clang++-18"
            echo "LD_LLD=ld.lld-18"
            echo "LLVM_AR=llvm-ar-18"
          } >> "$GITHUB_ENV"

      - name: Verify KVM availability
        run: |
          if [ ! -c /dev/kvm ]; then
            echo "::error::/dev/kvm not present on runner — KVM is required"
            exit 1
          fi
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi
          ls -l /dev/kvm
          qemu-system-x86_64 -accel help | grep -qw kvm || {
            echo "::error::qemu-system-x86_64 does not list kvm under -accel help"
            exit 1
          }

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> builddir/target"
          cache-directories: |
            third_party/limine
            third_party/ovmf
          cache-on-failure: true

      # The key only finds a tree; `make_slopos_cxx.sh`'s stamp still decides
      # whether it is rebuilt.
      - name: Key the C++ runtime cache
        id: cxx
        run: echo "compiler=$(clang++-18 --version | head -n 1 | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache the C++ runtime
        uses: actions/cache@v6
        with:
          path: third_party/slopos-cxx
          key: slopos-cxx-${{ runner.os }}-${{ steps.cxx.outputs.compiler }}-${{ hashFiles('toolchain/cxx/PIN', 'scripts/make_slopos_cxx.sh', 'scripts/build_userland.sh', 'slibc/include/**', 'slibc/builtins/**', 'rust-toolchain.toml', 'toolchain/rust/**', 'toolchain/libc/**', 'targets/x86_64-unknown-slopos.json', 'Cargo.toml', 'Cargo.lock') }}
          restore-keys: slopos-cxx-${{ runner.os }}-${{ steps.cxx.outputs.compiler }}-

      - name: Restore the Rust compiler cache
        uses: ./.github/actions/sccache-restore
        with:
          job: ci

      # `--raw` rather than `just test`: the progress-bar renderer only surfaces
      # klog on failure, so a green run's log carries no `LOCKDEP[...]` lines for
      # the ratchets below to read. The verdict is unchanged — `ClassifyRun` sets
      # the exit code independently of which renderer ran.
      - name: Run tests
        env:
          RUSTC_WRAPPER: sccache
        run: |
          set -o pipefail
          just _build-run-tests
          builddir/run_tests --raw --no-color 2>&1 | tee ci-test.log

      # Both boot-based ratchets parse the capture above rather than booting
      # again: three QEMU boots for one question each is two boots wasted, and a
      # second boot could disagree with the one that was actually graded.
      # The tests kernel is the only variant whose allowlist carries
      # `run_userland_tests` — it powers the machine off to end the run. Gated
      # here rather than from `check_kernel_elf_gates.sh` because the walk disassembles
      # the whole ELF (~8 s), which does not belong on the interactive loop.
      - name: Authority reachability ratchet (tests kernel)
        run: scripts/check_authority_reachability.sh --variant tests builddir/kernel-tests.elf

      - name: Test-count ratchet
        run: scripts/check_test_count.sh --log ci-test.log

      - name: Lockdep headroom ratchet
        run: scripts/check_lockdep_headroom.sh --log ci-test.log

      # The invariant here is not a measured ceiling but a structural one: a CPU
      # that is online must be eligible for task placement. It shipped broken —
      # the scheduler boot step reset the runqueues of three APs that were
      # already running, and the machine spent every boot placing 100 % of forks
      # and wakeups on CPU 0 while the other three scavenged by work stealing.
      # Nothing else on the wire says so.
      - name: SMP placement-eligibility gate
        run: scripts/check_sched_spread.sh --log ci-test.log

      # The image the run above just wrote to, held to e2fsck and a clean
      # superblock. Free: the image is already on disk and e2fsprogs is already
      # installed. An image SlopOS wrote that e2fsck rejects is a bug in SlopOS.
      - name: On-disk consistency of the image the suite wrote
        run: just check-fs-image

      # Two more boots, filtered to the persistence tests, on one image that
      # is *not* rebuilt between them. Cannot reuse the capture above: the
      # question is whether a write on boot N is readable on boot N+1, which
      # one boot cannot answer. Kept in this job rather than a parallel one
      # because a second job would rebuild the kernel, userland and images
      # from scratch to save ~90 s of QEMU wall clock.
      - name: Two-boot persistence check
        run: just test-persist

      # One boot with the 4 GiB dev disk on virtio-disk4. Cannot ride
      # the capture above: that run attaches no dev disk, and the utest
      # passes there by reporting there is none.
      - name: Dev-disk check
        run: just test-devdisk

      - name: Save the Rust compiler cache
        if: always()
        uses: ./.github/actions/sccache-save
        with:
          job: ci

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-test-log
          path: ci-test.log

  gates:
    name: Host tests and framekernel gates
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Setup Rust toolchain
        run: scripts/ensure_toolchain.sh

      # Not ~/.cargo/bin: a cached wild would be on PATH for the gates, which
      # grade the shipping pair only.
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> builddir/target"
          cache-bin: false
          cache-on-failure: true

      - name: Restore the Rust compiler cache
        uses: ./.github/actions/sccache-restore
        with:
          job: gates

      - name: Host-side unit tests (fast fail — same tests KernMiri interprets, minus UB detection)
        run: just test-host

      - name: Build the dev kernel
        env:
          RUSTC_WRAPPER: sccache
        run: just build-kernel-only

      # Delegates to the justfile so the gate list has one home. This
      # step used to inline the list and had already drifted — it was
      # missing check_wait_predicate_purity.sh, which `check-framekernel`
      # has run for some time. `check-framekernel-gates` is the scripts
      # only; the fmt / KernMiri / Verus steps that `check-framekernel`
      # also runs are covered by the `Check formatting` step of the boot lane
      # and by the `ostd-verify` job below.
      - name: Framekernel gates (vendor pin + unsafe/async/alloc/Drop/stack + wait purity + task ownership + TCB ratio)
        run: just check-framekernel-gates

      # The gates step above skips the pins because nothing has vendored yet;
      # this step vendors, then builds from an empty CARGO_HOME so the
      # runner's registry cache cannot answer for a missing crate.
      - name: Offline build from vendored sources
        run: just check-offline-build

      # Release inlines away roughly seven eighths of the dev kernel's
      # functions, so it is the only place small frames fused into one
      # oversized frame can show up. `just build-kernel-only` runs the stack and
      # soft-float gates on the ELF it produces; every self-test here ran with
      # the gates above.
      - name: Build and gate the release kernel
        if: ${{ !cancelled() }}
        env:
          RUSTC_WRAPPER: sccache
        run: |
          KERNEL_RELEASE=1 just build-kernel-only
          scripts/check_registry_sections.sh builddir/kernel-release.elf
          # The variant that ships. Its allowlist is shorter than dev's only
          # because optimisation inlines the handler closures; a *handler*
          # appearing here that is not in dev's list is a shipped image
          # reaching power by a path the dev build does not have.
          scripts/check_authority_reachability.sh --variant release builddir/kernel-release.elf

      # After the gates, so they grade the shipping pair with neither candidate
      # on PATH. The probe directories under builddir/gates/ are not cached: a
      # stale one would be a cached answer to the question the next step asks.
      - name: Cache the pinned wild binary
        if: ${{ !cancelled() }}
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/wild
          key: wild-linker-0.10.0-${{ runner.os }}

      # The gates above grade the shipping pair, where both candidates report
      # `skipped`. This installs them and grades the candidates only —
      # re-asking whether a Rust-hosted toolchain can build this kernel yet
      # (plans/self-hosting.md, Phase 1). wild is pinned so the answer moves
      # when someone bumps it, not underneath a run. `-preview` components go
      # missing from individual nightlies, and a day cg_clif did not build
      # upstream must not be a red run with no SlopOS-side remedy; the pinned
      # wild install fails loudly by contrast, and `--require` on it because a
      # skip would mean CI stopped asking.
      - name: Codegen backend and linker coverage
        if: ${{ !cancelled() }}
        run: |
          channel="$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup component add rustc-codegen-cranelift-preview --toolchain "$channel" \
            || echo "::warning::cranelift is not published for $channel — the gate will skip it"
          command -v wild >/dev/null || cargo install wild-linker --locked --version 0.10.0
          scripts/check_codegen_backend.sh --backend cranelift
          scripts/check_linker_script.sh --linker wild --require

      - name: Save the Rust compiler cache
        if: always()
        uses: ./.github/actions/sccache-save
        with:
          job: gates

  # Builds the tests userland itself rather than waiting on the boot lane's:
  # that build costs less than the boot lane queueing these checks.
  toolchain:
    name: Toolchain port
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # A cold compiler cache puts ~42 CPU-minutes of clang back in this job.
    timeout-minutes: 40
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_MAXSIZE: 1G

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Setup Rust toolchain
        run: scripts/ensure_toolchain.sh

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-18 lld-18 llvm-18 cmake ninja-build ccache
          for tool in clang-18 clang++-18 ld.lld-18 llvm-ar-18 ccache; do
            command -v "$tool" >/dev/null || { echo "::error::$tool not installed"; exit 1; }
          done
          {
            echo "CLANG=clang-18"
            echo "CLANGXX=clang++-18"
            echo "LD_LLD=ld.lld-18"
            echo "LLVM_AR=llvm-ar-18"
            echo "CCACHE_DIR=$HOME/.cache/ccache"
            echo "CCACHE_COMPILERCHECK=string:$(clang-18 --version | head -n 1)"
          } >> "$GITHUB_ENV"

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> builddir/target"
          cache-on-failure: true

      - name: Key the C++ runtime cache
        id: cxx
        run: echo "compiler=$(clang++-18 --version | head -n 1 | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache the C++ runtime
        uses: actions/cache@v6
        with:
          path: third_party/slopos-cxx
          key: slopos-cxx-${{ runner.os }}-${{ steps.cxx.outputs.compiler }}-${{ hashFiles('toolchain/cxx/PIN', 'scripts/make_slopos_cxx.sh', 'scripts/build_userland.sh', 'slibc/include/**', 'slibc/builtins/**', 'rust-toolchain.toml', 'toolchain/rust/**', 'toolchain/libc/**', 'targets/x86_64-unknown-slopos.json', 'Cargo.toml', 'Cargo.lock') }}
          restore-keys: slopos-cxx-${{ runner.os }}-${{ steps.cxx.outputs.compiler }}-

      # Tarballs only: the unpacked trees and the probes' build directories are
      # what the gates grade, and a cached one would be a cached answer.
      - name: Cache the pinned llvm-project tarball
        uses: actions/cache@v6
        with:
          path: third_party/llvm-project-*.src.tar.xz
          key: llvm-project-src-${{ hashFiles('toolchain/cxx/PIN') }}

      - name: Cache the pinned rustc source tarball
        uses: actions/cache@v6
        with:
          path: third_party/rustc-src-*.tar.xz
          key: rustc-src-${{ hashFiles('rust-toolchain.toml') }}

      - name: Restore the compiler cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ccache
          key: ccache-toolchain-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-toolchain-${{ runner.os }}-

      - name: Zero the compiler cache statistics
        run: ccache --zero-stats

      - name: Restore the Rust compiler cache
        uses: ./.github/actions/sccache-restore
        with:
          job: toolchain

      - name: Materialise the llvm-project sources
        id: llvm-src
        run: scripts/make_slopos_llvm_src.sh

      - name: Build the tests userland
        id: userland
        env:
          RUSTC_WRAPPER: sccache
        run: just _build-userland-tests

      - name: Materialise the compiler fork
        id: rustc-src
        run: scripts/make_rustc_src.sh

      # Each check below names the inputs it reads, so a red one does not hide
      # the rest. ccache makes an unchanged translation unit of the clang build
      # a lookup; the libraries are still linked and the probe still runs.
      - name: Clang driver link line
        if: ${{ !cancelled() && steps.llvm-src.outcome == 'success' }}
        run: |
          scripts/check_clang_driver.sh --self-test
          scripts/check_clang_driver.sh --require

      - name: C++ runtime against the C library it links
        if: ${{ !cancelled() && steps.userland.outcome == 'success' }}
        run: scripts/check_cxx_pin.sh

      # `--self-test` here rather than in the gates job: that job has no tree,
      # where the self-test's rejection cases can only report themselves
      # skipped — a gate CI has never seen reject.
      - name: LLVM port against slibc and libc++
        if: ${{ !cancelled() && steps.userland.outcome == 'success' && steps.llvm-src.outcome == 'success' }}
        run: |
          scripts/check_llvm_port.sh --self-test
          scripts/check_llvm_port.sh --require

      # Bootstrap's own dry run plus the compiler wrapper; the build it plans
      # is hours and is not run here.
      - name: Cross-build plan and compiler wrapper
        if: ${{ !cancelled() && steps.userland.outcome == 'success' && steps.rustc-src.outcome == 'success' }}
        run: |
          scripts/check_bootstrap_config.sh --self-test
          scripts/check_bootstrap_config.sh --require

      - name: Built-in target against the JSON spec
        if: ${{ !cancelled() && steps.rustc-src.outcome == 'success' }}
        run: |
          scripts/check_rustc_target.sh --self-test
          scripts/check_rustc_target.sh --require

      - name: Cargo fork against its `network` cut
        if: ${{ !cancelled() && steps.rustc-src.outcome == 'success' }}
        run: |
          scripts/check_cargo_fork.sh --self-test
          scripts/check_cargo_fork.sh --require

      - name: Count compiler cache misses
        id: ccache
        if: always()
        run: echo "misses=$(ccache --print-stats | awk '$1 == "cache_miss" { print $2 }')" >> "$GITHUB_OUTPUT"

      - name: Save the compiler cache
        if: always() && steps.ccache.outputs.misses != '0'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ccache
          key: ccache-toolchain-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save the Rust compiler cache
        if: always()
        uses: ./.github/actions/sccache-save
        with:
          job: toolchain

  ostd-verify:
    name: OSTD verification (KernMiri + Verus)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install just
        uses: extractions/setup-just@v4

      # Not `just setup`: KernMiri builds one host-target crate and interprets
      # it, so the owned `slopos` sysroot and Go are pure cost here.
      - name: Setup Rust toolchain
        run: scripts/ensure_toolchain.sh --no-sysroot

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip

      - name: Cache Miri sysroot
        uses: actions/cache@v6
        with:
          path: ~/.cache/miri
          key: miri-sysroot-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}

      - name: Cache Rust artifacts (Miri target dir)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> builddir/target"
          prefix-key: "v0-miri"
          cache-on-failure: true

      - name: Cache pinned Verus toolchain
        uses: actions/cache@v6
        with:
          path: third_party/verus
          key: verus-${{ runner.os }}-${{ hashFiles('verification/verus.toml') }}

      - name: Run KernMiri suite
        run: just check-miri

      - name: Run Verus proofs
        if: ${{ !cancelled() }}
        # Any PR touching slopos-ostd/ must pass `just verify`. It
        # resolves + pins Verus via scripts/ensure_verus.sh, then checks
        # every proof under verification/proofs/.
        run: just verify
