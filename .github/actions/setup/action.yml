name: Set up a SlopOS job
description: >-
  Everything a job needs before it runs its `just ci-*` recipe: just, the
  pinned toolchain, the host packages it names, KVM, and the caches of
  compiler output and pinned sources. Every job sets up through here, so the
  jobs differ only in the recipe they run.
inputs:
  job:
    description: Cache key prefix; one per job, since each builds different crates
    required: true
  sysroot:
    description: Materialise the owned `slopos` sysroot (every job but one that only builds host crates)
    default: "true"
  go:
    description: Install the Go toolchain the test runner is built with
    default: "false"
  llvm:
    description: Install clang, lld and llvm of the C++ runtime's pinned major and point the build at them
    default: "false"
  kvm:
    description: Install QEMU and require /dev/kvm
    default: "false"
  apt:
    description: Further Debian packages, space-separated
    default: ""
  pinned-sources:
    description: Restore the C++ runtime and the pinned llvm-project and recipe tarballs
    default: "false"
  rust-cache-bin:
    description: Cache ~/.cargo/bin (off where a cached binary would answer a gate's question)
    default: "true"
runs:
  using: composite
  steps:
    - uses: extractions/setup-just@v4

    - if: inputs.go == 'true'
      uses: actions/setup-go@v7
      with:
        go-version-file: tools/run_tests/go.mod
        cache-dependency-path: tools/run_tests/go.sum

    - shell: bash
      env:
        SYSROOT: ${{ inputs.sysroot }}
      run: |
        if [ "$SYSROOT" = "true" ]; then
          scripts/ensure_toolchain.sh
        else
          scripts/ensure_toolchain.sh --no-sysroot
        fi

    # `toolchain/cxx/PIN` states a floor (`clang_major_min`); these pin CI to
    # the sources' own major whatever the runner image defaults to, and
    # `scripts/cxx_host_tools.sh` treats them as an override that never falls
    # back. A tool named here that did not install fails now, not as a
    # cross-build failure much later.
    - shell: bash
      env:
        LLVM: ${{ inputs.llvm }}
        KVM: ${{ inputs.kvm }}
        APT: ${{ inputs.apt }}
      run: |
        pkgs="$APT"
        [ "$LLVM" = "true" ] && pkgs="$pkgs clang-18 lld-18 llvm-18"
        [ "$KVM" = "true" ] && pkgs="$pkgs qemu-system-x86"
        if [ -n "${pkgs// /}" ]; then
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $pkgs
        fi
        if [ "$LLVM" = "true" ]; then
          for tool in clang-18 clang++-18 ld.lld-18 llvm-ar-18; do
            command -v "$tool" >/dev/null || { echo "::error::$tool not installed"; exit 1; }
          done
          {
            echo "CLANG=clang-18"
            echo "CLANGXX=clang++-18"
            echo "LD_LLD=ld.lld-18"
            echo "LLVM_AR=llvm-ar-18"
          } >> "$GITHUB_ENV"
        fi

    - if: inputs.kvm == 'true'
      shell: bash
      run: |
        if [ ! -c /dev/kvm ]; then
          echo "::error::/dev/kvm not present on runner — KVM is required"
          exit 1
        fi
        if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
          sudo chmod 666 /dev/kvm
        fi
        qemu-system-x86_64 -accel help | grep -qw kvm || {
          echo "::error::qemu-system-x86_64 does not list kvm under -accel help"
          exit 1
        }

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: ". -> builddir/target"
        prefix-key: v0-${{ inputs.job }}
        cache-bin: ${{ inputs.rust-cache-bin }}
        cache-directories: |
          third_party/limine
          third_party/ovmf
        cache-on-failure: true

    # The key only finds a tree; `make_slopos_cxx.sh`'s stamp still decides
    # whether it is rebuilt.
    - if: inputs.pinned-sources == 'true'
      id: cxx
      shell: bash
      run: echo "compiler=$(clang++-18 --version | head -n 1 | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

    - if: inputs.pinned-sources == 'true'
      uses: actions/cache@v6
      with:
        path: third_party/slopos-cxx
        key: slopos-cxx-${{ runner.os }}-${{ steps.cxx.outputs.compiler }}-${{ hashFiles('toolchain/cxx/**', 'toolchain/cmake/**', 'scripts/make_slopos_cxx.sh', 'scripts/build_userland.sh', 'slibc/include/**', 'slibc/builtins/**', 'rust-toolchain.toml', 'toolchain/rust/**', 'toolchain/libc/**', 'targets/x86_64-unknown-slopos.json', 'Cargo.toml', 'Cargo.lock') }}
        restore-keys: slopos-cxx-${{ runner.os }}-${{ steps.cxx.outputs.compiler }}-

    - if: inputs.pinned-sources == 'true'
      uses: actions/cache@v6
      with:
        path: third_party/llvm-project-*.src.tar.xz
        key: llvm-project-src-${{ hashFiles('toolchain/cxx/PIN') }}

    - if: inputs.pinned-sources == 'true'
      uses: actions/cache@v6
      with:
        path: third_party/recipes
        key: recipes-src-${{ hashFiles('toolchain/recipes/**') }}
        restore-keys: recipes-src-

    - uses: ./.github/actions/sccache-restore
      with:
        job: ${{ inputs.job }}
